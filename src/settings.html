<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Audio Device Properties</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1e1d1b;
      color: #b0ada4;
      padding: 20px;
      font-size: 13px;
    }
    h2 {
      color: #c8b88a;
      font-size: 15px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .section {
      margin-bottom: 20px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .section h3 {
      font-size: 12px;
      color: #7a7870;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: #8a8780;
      font-size: 12px;
    }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 6px 10px;
      margin-bottom: 10px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      color: #b0ada4;
      font-family: inherit;
      font-size: 13px;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    button {
      padding: 6px 16px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      color: #b0ada4;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: rgba(255,255,255,0.1); }
    button.primary {
      background: rgba(200,184,138,0.15);
      border-color: rgba(200,184,138,0.3);
      color: #c8b88a;
    }
    .status-msg {
      color: #6a8a5a;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .status-msg.error {
      color: #e06050;
    }
  </style>
</head>
<body>
  <h2>Settings</h2>

  <div class="section">
    <h3>API Keys</h3>
    <label>OpenAI API Key (required)</label>
    <input type="password" id="openai-key" placeholder="sk-..." />
    <label>Groq API Key (optional)</label>
    <input type="password" id="groq-key" placeholder="gsk_..." />
    <button id="btn-test-keys" style="font-size:11px;padding:4px 10px;margin-top:4px;">Test Keys</button>
    <div id="key-test-results" style="margin-top:8px;font-size:12px;display:none;"></div>
  </div>

  <div class="section">
    <h3>Interview Settings</h3>
    <label>Audio Source</label>
    <select id="audio-source">
      <option value="both">System Audio + Microphone</option>
      <option value="system">System Audio Only</option>
      <option value="mic">Microphone Only</option>
    </select>
    <label style="display:flex;align-items:center;gap:8px;margin-top:6px;">
      <input type="checkbox" id="tts-enabled" />
      TTS Earpiece (reads answers aloud)
    </label>
  </div>

  <div class="section">
    <h3>Overlay</h3>
    <label>Theme</label>
    <select id="theme">
      <option value="normal">Normal</option>
      <option value="night">Night (dimmer)</option>
    </select>
  </div>

  <div class="section">
    <h3>API Proxy (optional)</h3>
    <label>OpenAI Base URL</label>
    <input type="text" id="openai-base-url" placeholder="https://api.openai.com (default)" />
    <label>Groq Base URL</label>
    <input type="text" id="groq-base-url" placeholder="https://api.groq.com (default)" />
    <span style="font-size:11px;color:#5a5850;">Route API calls through a proxy to mask DNS/SNI. Leave blank for direct.</span>
  </div>

  <div class="section">
    <h3>Resume</h3>
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <button id="btn-upload-resume" style="font-size:11px;padding:4px 10px;">Upload PDF</button>
      <span id="pdf-status" style="font-size:11px;color:#7a7870;align-self:center;"></span>
    </div>
    <input type="file" id="resume-file" accept=".pdf" style="display:none" />
    <textarea id="resume-text" placeholder="Paste your resume text here or upload a PDF..."></textarea>
  </div>

  <div class="section">
    <h3>Job Description (optional)</h3>
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <button id="btn-upload-jd" style="font-size:11px;padding:4px 10px;">Upload PDF</button>
      <span id="jd-pdf-status" style="font-size:11px;color:#7a7870;align-self:center;"></span>
    </div>
    <input type="file" id="jd-file" accept=".pdf" style="display:none" />
    <textarea id="job-description" placeholder="Paste the job description or upload a PDF..."></textarea>
  </div>

  <div class="btn-row">
    <button id="btn-cancel">Cancel</button>
    <button class="primary" id="btn-save">Save</button>
  </div>
  <div class="status-msg" id="save-status"></div>

  <script>
    const fields = {
      'openai-key': 'openai_api_key',
      'groq-key': 'groq_api_key',
      'audio-source': 'audio_source',
      'theme': 'theme',
      'resume-text': 'resume_text',
      'job-description': 'job_description',
      'openai-base-url': 'openai_base_url',
      'groq-base-url': 'groq_base_url',
    };

    async function loadSettings() {
      try {
        const config = await window.__TAURI__.core.invoke('load_config');
        for (const [elemId, configKey] of Object.entries(fields)) {
          const el = document.getElementById(elemId);
          if (el && config[configKey] !== undefined) {
            el.value = config[configKey];
          }
        }
        if (config.tts_enabled !== undefined) {
          document.getElementById('tts-enabled').checked = config.tts_enabled;
        }
      } catch (e) {
        // silently ignore load errors
      }
    }

    async function saveSettings() {
      const status = document.getElementById('save-status');
      status.className = 'status-msg';
      status.style.display = 'none';
      try {
        const config = {};
        for (const [elemId, configKey] of Object.entries(fields)) {
          const el = document.getElementById(elemId);
          config[configKey] = el ? el.value : '';
        }
        config.tts_enabled = document.getElementById('tts-enabled').checked;
        await window.__TAURI__.core.invoke('save_config', { config });
        status.textContent = 'Settings saved!';
        status.className = 'status-msg';
        status.style.display = 'block';
        setTimeout(() => { status.style.display = 'none'; }, 2000);
      } catch (e) {
        status.textContent = 'Save failed: ' + e;
        status.className = 'status-msg error';
        status.style.display = 'block';
      }
    }

    function closeSettings() {
      window.close();
    }

    async function handlePdfUpload(fileInputId, textareaId, statusId) {
      const fileInput = document.getElementById(fileInputId);
      const file = fileInput.files[0];
      if (!file) return;

      const statusEl = document.getElementById(statusId);

      if (file.size > 10 * 1024 * 1024) {
        statusEl.textContent = 'PDF too large (max 10MB)';
        fileInput.value = '';
        return;
      }

      statusEl.textContent = 'Parsing PDF...';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const bytes = new Uint8Array(arrayBuffer);
        // Convert to base64
        let binary = '';
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        const b64 = btoa(binary);

        const text = await window.__TAURI__.core.invoke('parse_pdf', { pdfB64: b64 });
        document.getElementById(textareaId).value = text;
        statusEl.textContent = 'PDF loaded (' + file.name + ')';
        setTimeout(() => { statusEl.textContent = ''; }, 3000);
      } catch (e) {
        statusEl.textContent = 'Failed: ' + e;
        setTimeout(() => { statusEl.textContent = ''; }, 4000);
      }
      fileInput.value = '';
    }

    async function testApiKeys() {
      const btn = document.getElementById('btn-test-keys');
      const resultsDiv = document.getElementById('key-test-results');
      btn.disabled = true;
      btn.textContent = 'Testing...';
      resultsDiv.style.display = 'block';
      resultsDiv.innerHTML = '<span style="color:#7a7870;">Checking API keys...</span>';

      try {
        // Save current values first so the test uses what's on screen
        await saveSettings();
        const results = await window.__TAURI__.core.invoke('test_api_keys');
        resultsDiv.textContent = '';
        for (const r of results) {
          const row = document.createElement('div');
          row.style.marginBottom = '6px';
          const color = r.valid ? '#6a8a5a' : '#e06050';
          const icon = r.valid ? '\u2713' : '\u2717';
          let text = icon + ' ' + r.provider;
          if (!r.valid) {
            text += ' \u2014 ' + r.error;
          } else {
            text += ' \u2014 Valid';
            if (r.remaining_requests) text += ' | Requests left: ' + r.remaining_requests;
            if (r.remaining_tokens) text += ' | Tokens left: ' + r.remaining_tokens;
            if (r.rate_limit_reset) text += ' | Resets: ' + r.rate_limit_reset;
          }
          row.textContent = text;
          row.style.color = color;
          resultsDiv.appendChild(row);
        }
      } catch (e) {
        resultsDiv.textContent = 'Test failed: ' + e;
        resultsDiv.style.color = '#e06050';
      }
      btn.disabled = false;
      btn.textContent = 'Test Keys';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      document.getElementById('btn-save').addEventListener('click', saveSettings);
      document.getElementById('btn-cancel').addEventListener('click', closeSettings);
      document.getElementById('btn-test-keys').addEventListener('click', testApiKeys);

      // PDF upload buttons
      document.getElementById('btn-upload-resume').addEventListener('click', () => {
        document.getElementById('resume-file').click();
      });
      document.getElementById('resume-file').addEventListener('change', () => {
        handlePdfUpload('resume-file', 'resume-text', 'pdf-status');
      });
      document.getElementById('btn-upload-jd').addEventListener('click', () => {
        document.getElementById('jd-file').click();
      });
      document.getElementById('jd-file').addEventListener('change', () => {
        handlePdfUpload('jd-file', 'job-description', 'jd-pdf-status');
      });
    });
  </script>
</body>
</html>
