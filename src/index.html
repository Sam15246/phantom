<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Device Properties</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="overlay">
    <div id="status-bar">
      <span id="status-indicator">● Ready</span>
      <span id="recording-timer" style="display:none">0:00</span>
      <span id="mode-label">General</span>
    </div>
    <div id="answer-box">
      <p class="placeholder-text">Press Ctrl+Shift+Y to start recording</p>
    </div>
    <div id="quick-actions" style="display:none">
      <button id="btn-copy" onclick="copyAnswer()">Copy</button>
      <button id="btn-copy-code" onclick="copyCode()">Copy Code</button>
    </div>
    <div id="follow-up" style="display:none">
      <input type="text" id="follow-up-input" placeholder="Ask a follow-up..." />
    </div>
  </div>
  <script src="lib/marked.min.js"></script>
  <script src="lib/highlight.min.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
